[package]
name = "intellistream-datahub-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Async Rust SDK for the IntelliStream DataHub REST API: time series and datapoints, events, resources and relationship edges, files, datasets, labels and subscriptions."
license = "Apache-2.0"
repository = "https://github.com/IntelliStream-DataHub/dataplatform-rust-sdk"
readme = "README.md"
keywords = ["datahub", "sdk", "client", "industrial", "iot"]
categories = ["api-bindings", "database", "asynchronous"]
exclude = [
    "/datahub_python_bindings",
    "/python_tests",
    "/run_python_tests.sh",
    "/resources",
]

[features]
# Synchronous client (intellistream_datahub_sdk::blocking), same split as reqwest::blocking.
blocking = []

[dependencies]
maplit = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
reqwest = {  version = "0.12", features = ["blocking", "json", "multipart", "stream"] }
chrono = { version ="0.4", features = ["serde"] }
rand = "0.9"
futures = "0.3"
dotenv = "0.15"
uuid = { version = "1.16", features = ["v4", "v7", "serde"] }
regex = "1.11.1"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
infer = { version = "0.19", default-features = false, features = ["std"] }
thiserror = "2.0.17"
zstd = "0.13"
geojson = "1"
# Reading (never verifying) the payload of a JWT the SDK already holds, to explain an
# otherwise-unexplained 401 — see `auth_diagnostics`.
base64 = "0.22"


#[lib]
#proc-macro = true