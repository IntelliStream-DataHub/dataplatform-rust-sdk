methods = [
  "listen",
]

# Page prose that belongs to the template rather than to any method.
[text]
services_title = "Services"
services_blurb = "Reached as attributes of a configured client -- ``client.timeseries``, ``client.events`` -- never imported. ``AsyncDataHubClient`` has the same services with every method a coroutine; each page shows both side by side."
