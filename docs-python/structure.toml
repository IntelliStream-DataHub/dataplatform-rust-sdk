blurb = "The enumerations this service validates against."
methods = [
  "types",
  "create_types",
  "list_types",
  "search_types",
  "list_sub_types",
  "search_sub_types",
  "list_statuses",
  "search_statuses",
  "list_sources",
  "search_sources",
  "list_dimension",
  "policies",
]

[[groups]]
