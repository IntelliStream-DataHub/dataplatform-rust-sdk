name: Release

on:
  push:
    tags: ['v*']
  # Rehearse the whole pipeline when the version or the release machinery changes, so it is
  # not first exercised during an actual release. The publish jobs skip unless this is a tag.
  pull_request:
    paths:
      - Cargo.toml
      - datahub_python_bindings/Cargo.toml
      - datahub_python_bindings/pyproject.toml
      - datahub_c_bindings/Cargo.toml
      - .github/workflows/release.yml
      - .github/workflows/build-wheels.yml

permissions:
  contents: read

jobs:
  versions:
    name: Tag matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          binding=$(grep -m1 '^version' datahub_python_bindings/Cargo.toml | cut -d'"' -f2)
          py=$(grep -m1 '^version' datahub_python_bindings/pyproject.toml | cut -d'"' -f2)
          c=$(grep -m1 '^version' datahub_c_bindings/Cargo.toml | cut -d'"' -f2)
          echo "crate=$crate binding=$binding pyproject=$py c=$c ref=${GITHUB_REF_NAME:-}"
          if [ "$crate" != "$binding" ] || [ "$crate" != "$py" ] || [ "$crate" != "$c" ]; then
            echo "::error::manifest versions disagree: $crate / $binding / $py / $c"
            exit 1
          fi
          # Only a tag push carries a version to check against; a rehearsal has none.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Final releases only: a prerelease cannot satisfy all three manifests at once,
            # since Cargo wants semver (0.5.0-rc.1) and PyPI wants PEP 440 (0.5.0rc1).
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$GITHUB_REF_NAME' is not a release tag (expected vX.Y.Z)"
              exit 1
            fi
            if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match manifest version $crate"
              exit 1
            fi
          fi

  crate:
    name: Crate builds, tests and packages
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --all-features
      - run: cargo test --no-run --all-features
      - run: cargo publish --dry-run

  wheels:
    name: Wheels
    needs: versions
    uses: ./.github/workflows/build-wheels.yml

  c-sdk:
    # The C library is not published to a registry: each OS build is kept as a workflow
    # artifact (header + shared + static library) for attaching to the release by hand. It does
    # not gate the crate or wheel publication.
    name: C bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: datahub_c_bindings
      - run: cargo build --release
        working-directory: datahub_c_bindings
      - uses: actions/upload-artifact@v6
        with:
          name: c-sdk-${{ matrix.os }}
          if-no-files-found: error
          path: |
            datahub_c_bindings/include/intellistream_datahub.h
            datahub_c_bindings/target/release/libintellistream_datahub.so
            datahub_c_bindings/target/release/libintellistream_datahub.dylib
            datahub_c_bindings/target/release/libintellistream_datahub.a
            datahub_c_bindings/target/release/intellistream_datahub.dll
            datahub_c_bindings/target/release/intellistream_datahub.dll.lib
            datahub_c_bindings/target/release/intellistream_datahub.lib

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [crate, wheels]
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'IntelliStream-DataHub'
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always 'wheels-*/*'

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [crate, wheels, pypi]
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'IntelliStream-DataHub'
    environment: release
    # Job-level permissions replace the workflow's `contents: read` wholesale, so it is repeated
    # here alongside the OIDC claim the auth action needs; without it `checkout` has no scope.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # Trades this run's OIDC identity for a crates.io token scoped to this crate and revoked in
      # the action's post step, so no long-lived credential exists to leak or to expire. Requires
      # a Trusted Publisher registered on the crate naming this repository, workflow and
      # environment; crates.io only accepts one on a crate that already has a published version,
      # which is why this could not be set up before 0.2.0 went out.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
