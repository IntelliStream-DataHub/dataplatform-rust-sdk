name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BINDINGS_DIR: datahub_python_bindings

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check manifests agree, and match the tag when there is one
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          binding=$(grep -m1 '^version' "$BINDINGS_DIR/Cargo.toml" | cut -d'"' -f2)
          py=$(grep -m1 '^version' "$BINDINGS_DIR/pyproject.toml" | cut -d'"' -f2)
          echo "crate=$crate binding=$binding pyproject=$py"

          if [ "$crate" != "$binding" ] || [ "$crate" != "$py" ]; then
            echo "::error::manifest versions disagree: $crate / $binding / $py"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            # Final releases only: a prerelease cannot satisfy all three manifests at once,
            # since Cargo wants semver (0.5.0-rc.1) and PyPI wants PEP 440 (0.5.0rc1).
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$tag' is not a release tag (expected vX.Y.Z)"
              exit 1
            fi
            if [ "${tag#v}" != "$crate" ]; then
              echo "::error::tag $tag does not match manifest version $crate"
              exit 1
            fi
          fi

  crate:
    name: Crate package check
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v6
      # `cargo publish` verifies default features only, so a feature-gated module can break
      # without failing the release. `blocking` did exactly that.
      - run: cargo build --all-features
      - run: cargo test --no-run --all-features
      - run: cargo publish --dry-run

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: guard
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64 }
          - { runner: ubuntu-22.04, target: x86 }
          - { runner: ubuntu-22.04, target: aarch64 }
          - { runner: ubuntu-22.04, target: armv7 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.BINDINGS_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: ${{ env.BINDINGS_DIR }}/dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    needs: guard
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64 }
          - { runner: ubuntu-22.04, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.BINDINGS_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: ${{ env.BINDINGS_DIR }}/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: guard
    strategy:
      matrix:
        platform:
          - { runner: windows-latest, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.BINDINGS_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: ${{ env.BINDINGS_DIR }}/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: guard
    strategy:
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.BINDINGS_DIR }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: ${{ env.BINDINGS_DIR }}/dist

  sdist:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.BINDINGS_DIR }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: ${{ env.BINDINGS_DIR }}/dist

  smoke-test:
    name: Install and import the wheel
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - run: |
          pip install dist/*.whl
          python -c "import intellistream_datahub_sdk as dh; print(dh.DataHubClient)"

  release-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [crate, linux, musllinux, windows, macos, sdist, smoke-test]
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always 'wheels-*/*'

  release-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [crate, linux, musllinux, windows, macos, sdist, smoke-test]
    environment: release
    steps:
      - uses: actions/checkout@v6
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
